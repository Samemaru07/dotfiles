$font = Noto Sans CJK JP

$cream  = rgb(255, 244, 214)
$cream_a = rgba(255, 244, 214, 0.9)
$orange = rgba(235, 165, 75, 0.95)
$blue   = rgba(160, 190, 228, 0.95)
$brown  = rgba(70, 45, 25, 0.55)

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /home/samemaru/Pictures/Wallpapers/GhostInTheShell.png
    blur_passes = 2
    blur_size = 4
    brightness = 0.7
    vibrancy = 0.2
    contrast = 1.0
}

# 時刻
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $cream
    font_size = 130
    font_family = $font
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(40, 25, 10, 0.8)
    text_align = center

    position = 0, 190
    halign = center
    valign = center
}

# 日付
label {
    monitor =
    text = cmd[update:60000] date +"%Y年%m月%d日 (%a)"
    color = $cream_a
    font_size = 24
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(40, 25, 10, 0.8)
    text_align = center

    position = 0, 85
    halign = center
    valign = center
}

# あいさつ
label {
    monitor =
    text = おかえりなさい、$USER
    color = $cream_a
    font_size = 20
    font_family = $font
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(40, 25, 10, 0.8)
    text_align = center

    position = 0, -30
    halign = center
    valign = center
}

# パスワード入力
input-field {
    monitor =
    size = 340, 56
    outline_thickness = 2
    rounding = 28

    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true

    inner_color = $brown
    outer_color = $orange $blue 45deg
    check_color = $blue $orange 120deg
    fail_color = rgba(235, 100, 75, 0.95) rgba(200, 60, 80, 0.95) 40deg
    font_color = $cream
    font_family = $font

    fade_on_empty = false
    placeholder_text = <i>パスワード</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    position = 0, -110
    halign = center
    valign = center
}
