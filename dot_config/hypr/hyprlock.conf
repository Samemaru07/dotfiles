$font = Sazanami Gothic

# カラーパレット
$white      = rgb(255, 255, 255)
$arch_blue  = rgb(23, 147, 209)       # Arch Linux Official Blue (#1793d1)
$pink_text  = rgb(255, 180, 205)
$yellow_txt = rgb(255, 225, 140)
$blue_txt   = rgb(175, 215, 255)
$input_bg   = rgba(255, 240, 245, 0.9)
$input_border = rgb(255, 155, 190)
$shadow     = rgba(80, 20, 50, 0.4)

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /home/samemaru/Pictures/Wallpapers/gits_lock.png
    blur_passes = 0
    brightness = 1.0
    contrast = 1.0
    fade_in = 0
}

# 時刻
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $white
    font_size = 130
    font_family = $font
    shadow_passes = 3
    shadow_size = 5
    shadow_color = $shadow
    text_align = left

    position = 148, 300
    halign = left
    valign = center
}

# 日付
label {
    monitor =
    text = cmd[update:60000] date +"%Y年%m月%d日 (%a)"
    color = $pink_text
    font_size = 24
    font_family = $font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $shadow
    text_align = left

    position = 148, 190
    halign = left
    valign = center
}

# 区切りの線 (Arch Blueのアクセントライン)
shape {
    monitor =
    size = 120, 6
    color = $arch_blue
    rounding = 3
    border_size = 0

    position = 148, 145
    halign = left
    valign = center
}

# もとこ（名前）
label {
    monitor =
    text = もとこ
    color = $yellow_txt
    font_size = 20
    font_family = $font
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow
    text_align = left

    position = 148, 100
    halign = left
    valign = center
}

# もとこ（セリフ）
label {
    monitor =
    text = 「うわぁぁぁあん！！やだぁぁぁッ！<br/>この義体、バトーの隣に並ぶと子どもに見えるの嫌ぁぁぁッ！！<br/>うっ……ひっく、早くセブロよこしなさいよぉぉぉおおッ！！」
    color = $white
    font_size = 18
    font_family = $font
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow
    text_align = left

    position = 148, 20
    halign = left
    valign = center
}

# バトー（名前）
label {
    monitor =
    text = バトー
    color = $blue_txt
    font_size = 20
    font_family = $font
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow
    text_align = left

    position = 148, -75
    halign = left
    valign = center
}

# バトー（セリフ）
label {
    monitor =
    text = 「見た目が子どもなんだからどう足掻いても子どもに見えるわ！<br/>泣くな泣くな、よしよししてやるから暴れるんじゃねぇ！！」
    color = $white
    font_size = 18
    font_family = $font
    shadow_passes = 2
    shadow_size = 3
    shadow_color = $shadow
    text_align = left

    position = 148, -135
    halign = left
    valign = center
}

# パスワード入力（sudo / pacman テイスト）
input-field {
    monitor =
    size = 400, 52
    outline_thickness = 3
    rounding = 26

    dots_size = 0.28
    dots_spacing = 0.35
    dots_center = true

    inner_color = $input_bg
    outer_color = $input_border
    check_color = rgb(255, 210, 120)
    fail_color = rgb(255, 120, 140)
    font_color = rgb(90, 50, 70)
    font_family = $font

    fade_on_empty = false
    placeholder_text = [sudo] password...
    check_text = pacman -Syu...
    fail_text = Permission denied ($ATTEMPTS)

    position = 148, -250
    halign = left
    valign = center
}
