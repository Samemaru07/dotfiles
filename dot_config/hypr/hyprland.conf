# hyprland.lua からの変換版 hyprland.conf
# 元ファイル: Lua API (hl.*) 版設定
# 参照: https://wiki.hypr.land/Configuring/Start/
#
# 変換にあたって確信が持てない/そのままでは対応できない箇所は
# 該当行の直前に「# NOTE:」で注記しています。詳細はチャット本文を参照してください。

env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = XCURSOR_THEME,FernCursor
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,FernCursor
env = HYPRCURSOR_SIZE,24
exec-once = hyprctl setcursor FernCursor 24

# ------------------
# ---- MONITORS ----
# ------------------

monitor=DP-1,1920x1080@60,0x0,1
monitor=DP-2,1920x1080@60,1920x0,1

workspace = 1, monitor:DP-1, default:true
workspace = 2, monitor:DP-2, default:true
workspace = 3, monitor:DP-1
workspace = 4, monitor:DP-2
workspace = 5, monitor:DP-1
workspace = 6, monitor:DP-2
workspace = 7, monitor:DP-1
workspace = 8, monitor:DP-2
workspace = 9, monitor:DP-1
workspace = 10, monitor:DP-2

# ---------------------
# ---- MY PROGRAMS ----
# ---------------------

$terminal = /home/samemaru/project/hyper-webview-fork/dist/linux-unpacked/hyper
$fileManager = dolphin
$menu = wofi --show drun

# -------------------
# ---- AUTOSTART ----
# -------------------

exec-once = fcitx5 -d
exec-once = nm-applet --indicator
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = waybar
exec-once = hyprpaper
exec-once = spotify
exec-once = zen-browser
exec-once = kitty --class="cava" -e cava
exec-once = kitty --class="asciiquarium" -e asciiquarium
exec-once = kitty --class="tty-clock" -e tty-clock -c
exec-once = kitty --class="btop" -e btop
exec-once = quickshell -c qs-hyprview
exec-once = openrgb --startminimized -p Ares.orp
exec-once = hypridle

# 元のコメントアウト例:
# exec-once = $terminal
# exec-once = nm-applet
# exec-once = waybar & hyprpaper & firefox

# -------------------------------
# ---- ENVIRONMENT VARIABLES ----
# -------------------------------

env = XCURSOR_THEME,FernCursor
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# -----------------------
# ----- PERMISSIONS -----
# -----------------------
# 元はコメントアウトされていた例。permissionディレクティブ自体は
# 変更後にHyprland再起動が必要な点も含め同様です。

# ecosystem {
#     enforce_permissions = true
# }
#
# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow

# -----------------------
# ---- LOOK AND FEEL ----
# -----------------------

general {
    gaps_in = 5
    gaps_out = 10

    border_size = 2

    col.active_border = rgba(23,147,209,0.5)
    col.inactive_border = rgba(595959aa)

    resize_on_border = true
    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = 0xee1a1a1a
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

# NOTE: "easy" は元コードで type = "spring" (mass/stiffness/dampening) の
# スプリング曲線として定義されていました。bezier= はcubic-bezierの
# 4つの制御点floatしか受け付けないため、そのままでは書けません。
# 下記は暫定的にeaseOutQuintで代用していますが、要ご確認・調整です。
bezier = easeOutQuint, 0.23, 1, 0.32, 1
bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
bezier = linear, 0, 0, 1, 1
bezier = almostLinear, 0.5, 0.5, 0.75, 1
bezier = quick, 0.15, 0, 0.1, 1

animations {
    enabled = true

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    # NOTE: 元は spring "easy" 使用。暫定でeaseOutQuintに置換。要確認。
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
    animation = zoomFactor, 1, 7, quick
}

# 元のコメントアウト例 (smart gaps):
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule {
#     name = no-gaps-wtv1
#     match:float = false
#     match:workspace = w[tv1]
#     border_size = 0
#     rounding = 0
# }
# windowrule {
#     name = no-gaps-f1
#     match:float = false
#     match:workspace = f[1]
#     border_size = 0
#     rounding = 0
# }

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

# NOTE: scrolling レイアウトブロックは比較的新しい/一般的でないレイアウトです。
# 現在お使いのHyprlandバージョンでこのセクション名・オプション名が
# 有効かどうか、wikiまたは `hyprctl` で要確認です。
scrolling {
    fullscreen_on_one_column = true
}

# ----------------
# ----  MISC  ----
# ----------------

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
    disable_splash_rendering = true
}

# ---------------
# ---- INPUT ----
# ---------------

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

# 3本指スワイプでワークスペース切り替え
gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

# ---------------------
# ---- KEYBINDINGS ----
# ---------------------

bind = SUPER, Q, exec, $terminal

# NOTE: 元は closeWindowBind:set_enabled(false) でランタイム的に
# 無効化できるハンドルを持っていました(コメントアウトで無効化例)。
# .conf にはバインドを後から無効化するハンドル機構が無いため、
# 無効化したい場合は行自体をコメントアウトしてください。
bind = SUPER, C, killactive,

bind = SUPER, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = SUPER, E, exec, $fileManager
bind = SUPER, V, togglefloating,
bind = SUPER, R, exec, $menu
bind = SUPER, P, pseudo,
bind = SUPER, J, layoutmsg, togglesplit # dwindle only

bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

bind = SUPER, S, togglespecialworkspace, magic
bind = SUPER SHIFT, S, movetoworkspace, special:magic

bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

bindl = ,XF86AudioNext, exec, playerctl next
bindl = ,XF86AudioPause, exec, playerctl play-pause
bindl = ,XF86AudioPlay, exec, playerctl play-pause
bindl = ,XF86AudioPrev, exec, playerctl previous

# 直前アクティブだったウィンドウに再度フォーカス
bind = ALT, TAB, focuscurrentorlast

# quickshell
bind = SUPER, TAB, exec, quickshell ipc -c qs-hyprview call expose toggle columnar

# スクショ
bind = , Print, exec, sh -c "grim -g \"$(slurp)\" \"$HOME/Pictures/Screenshots/$(date +\"%Y%m%d_%H%M%S\").png\""

# --------------------------------
# ---- WINDOWS AND WORKSPACES ----
# --------------------------------

# NOTE: 元は suppressMaximizeRule:set_enabled(false) でランタイム無効化可能な
# ハンドルでした。.conf側で無効化したい場合は下のブロックごとコメントアウトしてください。
windowrule {
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# 元のコメントアウト例 (layer_rule, ハンドルで無効化されていた):
# layerrule = noanim, ^my-overlay$

windowrule {
    name = move-hyprland-run
    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

# waybarの音量調節ウィンドウ
windowrule {
    name = pavucontrol-rules
    match:class = ^(org\.pulseaudio\.pavucontrol)$

    float = yes
    size = 741 532
    move = 1167 36
}

# ----------------------------------------
# ---- フローティング & ワークスペース固定 ----
# ----------------------------------------

# --- ワークスペース 1 (Dashboard) ---

# Spotify (左上)
windowrule {
    name = ws1-spotify
    match:class = ^(Spotify)$
    workspace = 1 silent
    float = yes
    size = 1000 600
    move = 50 50
}

# Cava (左下)
windowrule {
    name = ws1-cava
    match:class = ^(cava)$
    workspace = 1 silent
    float = yes
    size = 1000 350
    move = 50 680
}

# Asciiquarium (右上)
windowrule {
    name = ws1-asciiquarium
    match:class = ^(asciiquarium)$
    workspace = 1 silent
    float = yes
    size = 770 700
    move = 1100 50
}

# Tty-clock (右下)
windowrule {
    name = ws1-tty-clock
    match:class = ^(tty-clock)$
    workspace = 1 silent
    float = yes
    size = 770 250
    move = 1100 780
}


# --- ワークスペース 2 (Terminal) ---

# Hyper (中央に少し大きく)
windowrule {
    name = ws2-hyper
    match:class = ^(hyper)$
    workspace = 2 silent
    float = yes
    size = 1400 980
    center = yes
}


# --- ワークスペース 3 (Browser) ---

# Zen Browser (画面いっぱいにフローティング)
windowrule {
    name = ws3-zen-browser
    match:class = ^(zen)$
    workspace = 3 silent
    float = yes
    size = 1800 1000
    center = yes
}


# --- ワークスペース 4 (System Monitor) ---

# Btop (画面いっぱいにフローティング)
windowrule {
    name = ws4-btop
    match:class = ^(btop)$
    workspace = 4 silent
    float = yes
    size = 1800 1000
    center = yes
}
